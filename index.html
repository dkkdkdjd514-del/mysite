<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Номер телефона</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        /* Контейнер, що імітує екран мобільного телефону */
        .mobile-screen {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background-color: #1c242d;
            position: relative;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow: hidden;
        }

        /* Верхня панель (кнопка назад) */
        .top-bar {
            padding: 16px;
            display: flex;
            align-items: center;
        }

        .top-bar .material-icons-round {
            font-size: 28px;
            cursor: pointer;
            color: #ffffff;
        }

        /* Основний контент */
        .content {
            padding: 20px 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 12px;
            text-align: center;
        }

        p.subtitle {
            font-size: 15px;
            color: #8c99a6;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* Поля вводу */
        .input-group {
            width: 100%;
            margin-bottom: 24px;
        }

        .input-box {
            width: 100%;
            height: 54px;
            border: 1px solid #2b3643;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            position: relative;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .country-box {
            justify-content: space-between;
        }

        .country-box span.placeholder {
            color: #8c99a6;
            font-size: 16px;
        }

        .country-box .material-icons-round {
            color: #8c99a6;
        }

        .phone-box {
            border: 2px solid #5288c1; /* Активна рамка */
        }

        .floating-label {
            position: absolute;
            top: -9px;
            left: 12px;
            background-color: #1c242d;
            padding: 0 4px;
            color: #5288c1;
            font-size: 12px;
        }

        .phone-input {
            display: flex;
            align-items: center;
            font-size: 16px;
            width: 100%;
        }

        .phone-input .plus {
            margin-right: 2px;
        }

        .cursor {
            width: 2px;
            height: 20px;
            background-color: #5288c1;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Чекбокс */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            cursor: pointer;
            margin-top: -4px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            background-color: #5288c1;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
        }

        .checkbox .material-icons-round {
            font-size: 16px;
            color: #fff;
        }

        .checkbox-wrapper span.text {
            font-size: 15px;
            color: #ffffff;
        }

        /* Плаваюча кнопка (FAB) */
        .fab {
            width: 60px;
            height: 60px;
            background-color: #3390ec;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 270px; /* Над клавіатурою */
            right: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            border: none;
            outline: none;
        }

        .fab .material-icons-round {
            color: #ffffff;
            font-size: 28px;
        }

        /* Клавіатура */
        .keyboard {
            background-color: #151e27;
            padding: 8px 6px 16px 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .key {
            background-color: #2b3643;
            border-radius: 8px;
            height: 52px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        .key:active {
            background-color: #3b4755;
        }

        .key .letters {
            font-size: 10px;
            color: #8c99a6;
            margin-left: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            width: 30px;
            text-align: left;
        }

        .key.empty {
            background-color: transparent;
            box-shadow: none;
            cursor: default;
        }

        .key.icon-key {
            background-color: #2b3643;
        }

        .key .material-icons-round {
            font-size: 24px;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <div class="top-bar">
            <span class="material-icons-round">arrow_back</span>
        </div>

        <div class="content">
            <h1>Номер телефона</h1>
            <p class="subtitle">Проверьте код страны и введите свой<br>номер телефона.</p>

            <div class="input-group">
                <div class="input-box country-box">
                    <span class="placeholder">Страна</span>
                    <span class="material-icons-round">chevron_right</span>
                </div>

                <div class="input-box phone-box">
                    <span class="floating-label">Номер телефона</span>
                    <div class="phone-input">
                        <span class="plus">+</span>
                        <div class="cursor"></div>
                    </div>
                </div>
            </div>

            <div class="checkbox-wrapper">
                <div class="checkbox">
                    <span class="material-icons-round">check</span>
                </div>
                <span class="text">Синхронизировать контакты</span>
            </div>
        </div>

        <button class="fab">
            <span class="material-icons-round">arrow_forward</span>
        </button>

        <div class="keyboard">
            <div class="key">1</div>
            <div class="key">2 <span class="letters">ABC</span></div>
            <div class="key">3 <span class="letters">DEF</span></div>
            <div class="key">4 <span class="letters">GHI</span></div>
            <div class="key">5 <span class="letters">JKL</span></div>
            <div class="key">6 <span class="letters">MNO</span></div>
            <div class="key">7 <span class="letters">PQRS</span></div>
            <div class="key">8 <span class="letters">TUV</span></div>
            <div class="key">9 <span class="letters">WXYZ</span></div>
            <div class="key empty"></div>
            <div class="key">0 <span class="letters" style="font-size: 16px; margin-left: 4px;">+</span></div>
            <div class="key icon-key"><span class="material-icons-round">backspace</span></div>
        </div>
    </div>

</body>
</html>
