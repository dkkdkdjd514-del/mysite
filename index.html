<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Номер телефона</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000; /* Темний фон навколо додатка (для ПК) */
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* Контейнер мобільного екрана */
        .mobile-screen {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background-color: #1c242d;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Верхня панель (кнопка назад) */
        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
        }

        .top-bar svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            cursor: pointer;
        }

        /* Основний контент */
        .content {
            padding: 16px 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            font-size: 15px;
            color: #8c99a6;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        /* Поля вводу */
        .input-group {
            width: 100%;
            margin-bottom: 24px;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 54px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* Поле "Країна" */
        .country-box {
            border: 1px solid #2b3643;
            padding: 0 16px;
            justify-content: space-between;
        }

        .country-box .placeholder {
            color: #8c99a6;
            font-size: 16px;
        }

        .country-box svg {
            width: 24px;
            height: 24px;
            fill: #8c99a6;
        }

        /* Поле "Номер телефону" */
        .phone-box fieldset {
            position: absolute;
            top: -5px;
            left: 0;
            right: 0;
            bottom: 0;
            margin: 0;
            padding: 0 10px;
            border: 2px solid #5288c1;
            border-radius: 8px;
            pointer-events: none;
        }

        .phone-box legend {
            color: #5288c1;
            font-size: 12px;
            padding: 0 4px;
            line-height: 11px;
            margin-left: 2px;
        }

        .phone-box .inner-content {
            position: relative;
            z-index: 1;
            padding: 0 16px;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .phone-box .prefix {
            font-size: 16px;
            margin-right: 2px;
        }

        .cursor {
            width: 1.5px;
            height: 20px;
            background-color: #5288c1;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Чекбокс */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            cursor: pointer;
            margin-top: -4px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            background-color: #5288c1;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 16px;
        }

        .checkbox svg {
            width: 16px;
            height: 16px;
            fill: #ffffff;
        }

        .checkbox-wrapper .text {
            font-size: 15px;
            color: #ffffff;
        }

        /* Нижня секція (Кнопка + Клавіатура) */
        .bottom-section {
            position: relative;
            width: 100%;
        }

        /* Плаваюча кнопка (FAB) */
        .fab {
            width: 60px;
            height: 60px;
            background-color: #3390ec;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: -76px; /* Завжди над клавіатурою */
            right: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            border: none;
            outline: none;
        }

        .fab svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        /* Клавіатура */
        .keyboard {
            background-color: #151e27;
            padding: 8px 6px 12px 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .key {
            background-color: #2b3643;
            border-radius: 8px;
            height: 52px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 25px;
            font-weight: 400;
            cursor: pointer;
            user-select: none;
        }

        .key:active {
            background-color: #3b4755;
        }

        .key .letters {
            font-size: 11px;
            color: #8c99a6;
            margin-left: 8px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .key.empty {
            background-color: transparent;
            cursor: default;
        }

        .key.empty:active {
            background-color: transparent;
        }

        .key svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <div class="top-bar">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </div>

        <div class="content">
            <h1>Номер телефона</h1>
            <p class="subtitle">Проверьте код страны и введите свой<br>номер телефона.</p>

            <div class="input-group">
                <div class="input-box country-box">
                    <span class="placeholder">Страна</span>
                    <svg viewBox="0 0 24 24">
                        <path d="M9.29 15.88L13.17 12 9.29 8.12c-.39-.39-.39-1.02 0-1.41.39-.39 1.02-.39 1.41 0l4.59 4.59c.39.39.39 1.02 0 1.41L10.7 17.3c-.39.39-1.02.39-1.41 0-.38-.39-.39-1.03 0-1.42z"/>
                    </svg>
                </div>

                <div class="input-box phone-box">
                    <fieldset>
                        <legend>Номер телефона</legend>
                    </fieldset>
                    <div class="inner-content">
                        <span class="prefix">+</span>
                        <div class="cursor"></div>
                    </div>
                </div>
            </div>

            <div class="checkbox-wrapper">
                <div class="checkbox">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </div>
                <span class="text">Синхронизировать контакты</span>
            </div>
        </div>

        <div class="bottom-section">
            <button class="fab">
                <svg viewBox="0 0 24 24">
                    <path d="M5 13h11.17l-4.88 4.88c-.39.39-.39 1.03 0 1.42.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41l-6.58-6.6a.996.996 0 1 0-1.41 1.41L16.17 11H5c-.55 0-1 .45-1 1s.45 1 1 1z"/>
                </svg>
            </button>

            <div class="keyboard">
                <div class="key">1</div>
                <div class="key">2 <span class="letters">ABC</span></div>
                <div class="key">3 <span class="letters">DEF</span></div>
                <div class="key">4 <span class="letters">GHI</span></div>
                <div class="key">5 <span class="letters">JKL</span></div>
                <div class="key">6 <span class="letters">MNO</span></div>
                <div class="key">7 <span class="letters">PQRS</span></div>
                <div class="key">8 <span class="letters">TUV</span></div>
                <div class="key">9 <span class="letters">WXYZ</span></div>
                <div class="key empty"></div>
                <div class="key">0 <span class="letters" style="font-size: 16px; margin-left: 4px; font-weight: normal;">+</span></div>
                <div class="key">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
